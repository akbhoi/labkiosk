services:
  # Interactive Kiosk Client Simulator (PC-01)
  # Access via browser: http://localhost:6080/vnc.html
  kiosk-simulator:
    # Same name the publish workflow pushes, so `docker compose pull` fetches the
    # published image and `docker compose up -d --build` replaces it with your
    # working tree. The image bakes the client source in (see Dockerfile), so a
    # pulled one runs main's agent and extension, not your local edits.
    image: ghcr.io/akbhoi/labkiosk:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labkiosk-client-01

    # The entrypoint spawns Xvfb, Openbox, x11vnc, websockify and two watchdog
    # loops, none of which reap their own children. Without an init, PID 1 is a
    # bash script that never calls wait() on them and the container slowly fills
    # with zombie chromium and scrot processes over a long session.
    init: true

    ports:
      # Only the noVNC display is published, and only to this machine. Bound to
      # 127.0.0.1 because noVNC here is an unauthenticated-by-design endpoint
      # behind an 8-character RFB secret: on 0.0.0.0 anyone on the same network
      # (a cafe, a school Wi-Fi) reaches a live desktop. To share it, put a proxy
      # that authenticates in front, or use a Cloudflare Tunnel with Access.
      #
      # The agent's API stays loopback-only inside the container, as on a real
      # workstation, so drive the setup wizard from the noVNC screen.
      - "127.0.0.1:6080:6080"

    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"

    environment:
      # Where the simulated workstation enrols. Override WORKER_URL in your shell
      # to point the simulator at a different control plane -- a deployed worker,
      # or `pnpm dev` on a non-default port. The agent accepts an http origin only
      # for loopback and container-gateway hosts; everything else must be https.
      # The image is built for Asia/Kolkata (IST); this lets a deployment
      # elsewhere run the same image on its own clock without rebuilding.
      - TZ=${TZ:-Asia/Kolkata}
      - WORKER_URL=${WORKER_URL:-http://host.docker.internal:8787}
      - LABKIOSK_DOMAIN=${LABKIOSK_DOMAIN:-labkiosk.akbhoi.com}
      # Left empty on purpose: the entrypoint then generates a random password
      # per container and prints it in the log. A fixed default would be a
      # published password on a port that grants keyboard and mouse control.
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      # Optional: a public hostname (e.g. a Cloudflare Tunnel) that reaches this
      # container's noVNC port. The agent reports it so the console's "Remote
      # Control" opens it instead of assuming <pc>.<tunnel-domain>.
      - LABKIOSK_REMOTE_HOST=${LABKIOSK_REMOTE_HOST:-}

    volumes:
      # Live-edit the client without rebuilding: these shadow the image's copies,
      # so `docker compose restart` picks up agent or extension changes.
      - ./distro-builder/config/includes.chroot/opt/labkiosk:/opt/labkiosk
      # Mounted for the same reason, and because the agent fails closed without
      # it -- editing the policy base otherwise appears to do nothing until the
      # image is rebuilt.
      - ./distro-builder/config/includes.chroot/usr/share/labkiosk:/usr/share/labkiosk:ro

    # Inherited from the image, but restated so `docker compose ps` reports
    # health even when running a pulled image built before it was added.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/api/status"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3

    # Chromium, Xvfb and the watchdogs need a moment to come down cleanly;
    # the default 10s SIGKILLs them mid-write.
    stop_grace_period: 20s

    shm_size: "1gb" # Sufficient shared memory for Chromium rendering
    restart: unless-stopped

    # The container browses the open web, so it is treated as untrusted:
    #   * it runs as the unprivileged kiosk user (USER in the Dockerfile) with
    #     Chromium's sandbox enabled;
    #   * no capabilities beyond the one its sandbox needs (see cap_add), and
    #     no-new-privileges so nothing setuid can escalate;
    #   * a read-only root filesystem, with tmpfs for the four paths that are
    #     written at runtime. /tmp needs exec because Chromium maps files there.
    #   * limits, so a runaway page cannot take the host down with it.
    # Everything written to these tmpfs mounts, enrolment included, is discarded
    # when the container stops -- which is what the real image does with its RAM
    # overlay anyway.
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
      - /run:mode=0755
      # Sticky-but-writable (1777) rather than owned by the kiosk user: neither
      # Docker nor Podman accepts uid= on a tmpfs mount, and the container has a
      # single unprivileged user. The agent still writes its device token with
      # mode 0600.
      - /etc/labkiosk:mode=1777
      - /etc/chromium/policies/managed:mode=1777
    cap_drop:
      - ALL
    cap_add:
      # The one capability Chromium's sandbox needs: its zygote chroots itself
      # into an empty directory before spawning renderers, and the runtime's
      # seccomp policy only permits chroot() with this capability. Without it
      # every tab dies with `Check failed: sys_chroot("/proc/self/fdinfo/")`
      # and the screen stays black. The renderers themselves end up with no
      # capabilities at all, in their own user and PID namespaces.
      - SYS_CHROOT
    security_opt:
      # Safe here because the sandbox uses user namespaces, not the setuid
      # helper, which could not raise privileges under this setting anyway.
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
