name: "Container images: build & scan"

# Builds both images without pushing and fails on a fixed critical CVE, so a
# broken Dockerfile or an out-of-date base fails the pull request rather than
# the release tag (docker-publish.yml publishes them from a tag). Runs when
# something that goes into an image changed, and daily so both images are
# rebuilt and scanned even when nothing did (APT_REFRESH refreshes their
# packages). The push to main keeps main's layer cache warm for pull requests.
on:
  push:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "distro-builder/**"
      - "docker-test/**"
      - ".github/workflows/images.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "distro-builder/**"
      - "docker-test/**"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: Build & scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Both images are published from a release tag by docker-publish.yml. The
    # gha cache scopes are shared with that workflow, so the expensive apt
    # layers are downloaded once across both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: labkiosk
            context: .
            file: Dockerfile
          - name: labkiosk-iso-builder
            context: distro-builder
            file: distro-builder/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Today's date, so the package layer is rebuilt once a day (APT_REFRESH).
      - name: Date the package layer
        id: apt
        run: echo "refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ci/${{ matrix.name }}:pr
          build-args: APT_REFRESH=${{ steps.apt.outputs.refresh }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The same gate docker-publish.yml applies after pushing, run here so a
      # fixed critical in the base image fails the pull request instead of the
      # release tag.
      - name: Scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci/${{ matrix.name }}:pr
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
