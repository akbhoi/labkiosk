name: Build Debian Kiosk ISO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: read

# An ISO build is ~15 minutes of runner time and writes a release on tags.
# Never let two of them run against the same ref.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # debootstrap, the squashfs and the finished hybrid ISO together need
      # well over the free space a stock runner has once its preinstalled
      # toolchains are counted. Reclaiming them first is cheaper than
      # diagnosing an ENOSPC two thirds of the way through a build.
      - name: Free disk space on the runner
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1

      - name: Warn when a release build has no GRUB password pinned
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        run: |
          if ! grep -q '^PASSWORD_PBKDF2=grub\.pbkdf2\.sha512\.' distro-builder/config/includes.chroot/usr/share/labkiosk/grub.pin; then
            echo "::warning file=distro-builder/config/includes.chroot/usr/share/labkiosk/grub.pin::No GRUB password is pinned. This release ISO boots with an editable boot menu; see distro-builder/README.md 'Securing the Boot Chain'."
          fi

      # Over-the-air updates, phase 2: a release is also a signed update in R2.
      # Checked before the 15-minute build, so a release missing its key or
      # its bucket fails in seconds rather than after the boot test.
      - name: Check the over-the-air release settings (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          CONTROLLER_URL: ${{ vars.CONTROLLER_URL }}
        run: |
          missing=""
          for name in UPDATE_SIGNING_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID R2_RELEASES_BUCKET RELEASE_NOTES_TOKEN CONTROLLER_URL; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::A release is signed, uploaded to R2 and announced to the controller, and these are not set:$missing. See distro-builder/README.md 'Over-the-air releases'."
            exit 1
          fi
          case "$CONTROLLER_URL" in
            https://*) ;;
            *) echo "::error::CONTROLLER_URL must be the controller's https:// address, such as https://labkiosk.org."; exit 1 ;;
          esac
          version="$(tr -d '[:space:]' < distro-builder/config/includes.chroot/usr/share/labkiosk/version)"
          tag="${GITHUB_REF_NAME#[vV]}"
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match usr/share/labkiosk/version ($version)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built through buildx so the apt layer is cached. The scope is shared
      # with docker-publish.yml, so a publish run and a release build reuse the
      # same layers instead of each installing live-build from scratch.
      - name: Build the ISO builder image
        uses: docker/build-push-action@v7
        with:
          context: distro-builder
          file: distro-builder/Dockerfile
          push: false
          load: true
          tags: ghcr.io/akbhoi/labkiosk-iso-builder:ci
          cache-from: type=gha,scope=labkiosk-iso-builder
          cache-to: type=gha,mode=max,scope=labkiosk-iso-builder

      # GitHub runners give a rootful Docker daemon, so --privileged really is
      # privileged and debootstrap's mknod succeeds. See distro-builder/README.md.
      - name: Compile the ISO
        run: |
          mkdir -p distro-builder/out
          docker run --privileged --rm \
            -v "$PWD/distro-builder/out:/build/out" \
            ghcr.io/akbhoi/labkiosk-iso-builder:ci

      - name: Verify the checksum
        working-directory: distro-builder/out
        run: |
          cat labkiosk-debian12-amd64.iso.sha256
          sha256sum -c labkiosk-debian12-amd64.iso.sha256
          ls -lh labkiosk-debian12-amd64.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v7
        with:
          name: labkiosk-debian12-amd64-iso
          # The checksum travels with the image; an artifact nobody can verify
          # is a downgrade from one they can.
          path: |
            distro-builder/out/labkiosk-debian12-amd64.iso
            distro-builder/out/labkiosk-debian12-amd64.iso.sha256
          retention-days: 14
          compression-level: 0 # The ISO is already gzip-compressed internally.

      # Over-the-air updates, phase 1, on a real install: the ISO's own
      # installer writes a virtual disk, which then boots in QEMU with KVM to
      # prove the one try, the promotion and both kinds of rollback. Before
      # the release step, so an ISO that cannot roll back is never published.
      - name: Boot-test the installed disk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso squashfs-tools
          sudo distro-builder/tests/vm/boot-test.sh \
            distro-builder/out/labkiosk-debian12-amd64.iso "$RUNNER_TEMP/boot-test"

      - name: Upload boot-test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test-screenshots
          path: ${{ runner.temp }}/boot-test/*.ppm
          if-no-files-found: ignore
          retention-days: 7

      # The manifest names every file's size, sha256 and 8 MiB chunk hashes; its
      # detached signature is what a workstation checks with gpgv before it
      # downloads a byte (docs/OTA_UPDATES.md section 5.3). The signature is
      # verified here against the keys the image carries, so a secret that does
      # not match them can never publish a release no workstation would take.
      - name: Sign the over-the-air release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PASSPHRASE: ${{ secrets.UPDATE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          share=distro-builder/config/includes.chroot/usr/share/labkiosk
          version="$(tr -d '[:space:]' < "$share/version")"
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          release="$RUNNER_TEMP/release"
          rm -rf "$release"
          mkdir -p "$release"
          xorriso -osirrox on -indev distro-builder/out/labkiosk-debian12-amd64.iso \
            -extract /live/vmlinuz "$release/vmlinuz" \
            -extract /live/initrd.img "$release/initrd.img" \
            -extract /live/filesystem.squashfs "$release/filesystem.squashfs" >/dev/null 2>&1
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python3 distro-builder/tools/make-release-manifest.py \
            --live "$release" --version "$version" \
            --security-floor "$(tr -d '[:space:]' < "$share/security-floor")" \
            --channel "$channel" --out "$release/manifest.json"

          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" | gpg --batch --import
          printf '%s' "${UPDATE_SIGNING_PASSPHRASE:-}" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --detach-sign --output "$release/manifest.json.sig" "$release/manifest.json"

          keyrings=()
          for keyring in "$share"/update-keys/*.gpg; do keyrings+=(--keyring "$PWD/$keyring"); done
          GNUPGHOME="$(mktemp -d)" gpgv "${keyrings[@]}" "$release/manifest.json.sig" "$release/manifest.json"
          ls -l "$release"

      # Each release is a folder of its own, written once: a manifest that
      # changed under a workstation halfway through its download would make it
      # start again. The manifest goes last, so a release is never visible
      # before its files are.
      - name: Upload the over-the-air release to R2 (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not accept the default CRC checksums of newer AWS CLIs.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < distro-builder/config/includes.chroot/usr/share/labkiosk/version)"
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="releases/$version"
          if found="$(aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_RELEASES_BUCKET" \
                        --key "$prefix/manifest.json" 2>&1)"; then
            echo "::error::$prefix is already published in R2. A release is never overwritten; bump the version."
            exit 1
          elif ! printf '%s' "$found" | grep -q '(404)'; then
            echo "::error::Could not check R2 for $prefix: $found"
            exit 1
          fi
          for name in vmlinuz initrd.img filesystem.squashfs manifest.json.sig manifest.json; do
            aws s3 cp --no-progress --endpoint-url "$endpoint" \
              "$RUNNER_TEMP/release/$name" "s3://$R2_RELEASES_BUCKET/$prefix/$name"
          done

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v3
        with:
          name: "Lab Kiosk ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            distro-builder/out/labkiosk-debian12-amd64.iso
            distro-builder/out/labkiosk-debian12-amd64.iso.sha256
          draft: false
          prerelease: false

      # /download lists the releases the controller has read from GitHub, which
      # it otherwise does hourly: ask it to read them now, so the new ISO and
      # its checksum are offered the moment the release exists. GitHub can take
      # a few seconds to list a new release, hence the retries.
      - name: Offer the release on the download page (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        env:
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          CONTROLLER_URL: ${{ vars.CONTROLLER_URL }}
        run: |
          set -euo pipefail
          answer="$RUNNER_TEMP/release-notes-sync.json"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS --max-time 30 -o "$answer" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $RELEASE_NOTES_TOKEN" "${CONTROLLER_URL%/}/api/release-notes/sync")" || status="000"
            case "$status" in
              200)
                latest="$(jq -r '.latest // empty' "$answer")"
                if [ "$latest" = "$GITHUB_REF_NAME" ]; then
                  echo "/download now offers $latest."
                  exit 0
                fi
                echo "GitHub does not list $GITHUB_REF_NAME yet (newest: ${latest:-none})." ;;
              401|503)
                echo "::error::The controller refused the request ($status): RELEASE_NOTES_TOKEN must match the Worker's secret of the same name. The release is published; /download offers it after the next hourly run."
                exit 1 ;;
              *)
                echo "The controller answered $status (attempt $attempt)." ;;
            esac
            sleep 10
          done
          echo "::error::/download does not offer $GITHUB_REF_NAME yet. The release is published; the hourly run offers it within the hour."
          exit 1
