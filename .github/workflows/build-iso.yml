name: Build Debian Kiosk ISO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

jobs:
  build-iso:
    name: Build Live ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Warn when a release build has no GRUB password pinned
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        run: |
          if ! grep -q '^PASSWORD_PBKDF2=grub\.pbkdf2\.sha512\.' distro-builder/config/includes.chroot/usr/share/labkiosk/grub.pin; then
            echo "::warning file=distro-builder/config/includes.chroot/usr/share/labkiosk/grub.pin::No GRUB password is pinned. This release ISO boots with an editable boot menu; see distro-builder/README.md 'Securing the Boot Chain'."
          fi

      - name: Build ISO using Docker Container
        run: |
          docker build -t labkiosk-iso-builder distro-builder
          mkdir -p distro-builder/out
          docker run --privileged --rm -v "$PWD/distro-builder/out:/build/out" labkiosk-iso-builder

      - name: Show Checksum
        run: cat distro-builder/out/labkiosk-debian12-amd64.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labkiosk-debian12-amd64-iso
          path: distro-builder/out/labkiosk-debian12-amd64.iso
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          name: "Lab Kiosk ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            distro-builder/out/labkiosk-debian12-amd64.iso
            distro-builder/out/labkiosk-debian12-amd64.iso.sha256
          draft: false
          prerelease: false
