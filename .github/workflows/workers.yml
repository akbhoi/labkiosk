name: "Cloudflare Workers: typecheck & test"

# The control plane and the email Worker: typecheck and test both. Runs only
# when something that goes into a Worker changed: wiki/ is bundled into the
# control plane as its /docs pages, and a test fails when
# src/docs_content.generated.ts no longer matches it.
#
# Nothing here deploys. Cloudflare Workers Builds deploys both Workers from
# main with cloudflare-control/scripts/workers-builds-deploy.sh, which runs
# these same checks first. CircleCI (.circleci/config.yml) runs these two jobs
# from this file as well.
on:
  push:
    branches: [ main ]
    paths:
      - "cloudflare-control/**"
      - "cloudflare-email-routing/**"
      - "wiki/**"
      - ".github/workflows/workers.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "cloudflare-control/**"
      - "cloudflare-email-routing/**"
      - "wiki/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a new push cancels the run it supersedes. main: every push
# keeps its own result.
concurrency:
  group: workers-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  control-plane:
    name: Control plane typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloudflare-control/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm --prefix cloudflare-control install --frozen-lockfile

      - name: TypeScript Typecheck (worker and tests)
        run: pnpm --prefix cloudflare-control run typecheck

      - name: Run Integration Tests
        run: pnpm --prefix cloudflare-control test

  email-worker:
    name: Email Worker typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloudflare-email-routing/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm --prefix cloudflare-email-routing install --frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm --prefix cloudflare-email-routing run typecheck

      - name: Run Tests
        run: pnpm --prefix cloudflare-email-routing test
