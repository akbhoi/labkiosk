name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Daily, so both images are rebuilt and scanned for fixed criticals even when
  # nothing that goes into them changed (APT_REFRESH refreshes their packages).
  schedule:
    - cron: "15 1 * * *"
  # On main, also a manual deploy of the control plane, after the same tests.
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a new push cancels the run it supersedes. main: every push
# gets its own run, so a later push never cancels a deploy halfway through its
# migrations, nor skips one by replacing it while it waits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # What the push or pull request touched, so the jobs that cannot be affected
  # are skipped. Plain git: no third-party action for a diff. Anything that is
  # not a push or a pull request, or a range git cannot read (a new branch, a
  # force-push), counts as touching everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
      cloudflare: ${{ steps.diff.outputs.cloudflare }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --name-only "$base...HEAD" > "$RUNNER_TEMP/changed.txt"
            echo "Changed since ${base:0:12}:"; cat "$RUNNER_TEMP/changed.txt"
          else
            echo "No base to compare with ($EVENT): every job runs."
            printf '%s\n' Dockerfile cloudflare-control/ > "$RUNNER_TEMP/changed.txt"
          fi
          matches() { grep -qE "$1" "$RUNNER_TEMP/changed.txt" && echo true || echo false; }
          {
            echo "images=$(matches '^(Dockerfile|docker-compose\.yml|\.dockerignore|distro-builder/|docker-test/|\.github/workflows/ci\.yml)')"
            echo "cloudflare=$(matches '^(cloudflare-control/|cloudflare-email-routing/|\.github/workflows/(ci|deploy-cloudflare)\.yml)')"
          } | tee -a "$GITHUB_OUTPUT"

  images:
    name: Container Images Build
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Both images are published from main by docker-publish.yml. Building them
    # here as well means a broken Dockerfile fails on the pull request rather
    # than after merge, and the gha cache scopes are shared with that workflow
    # so the expensive apt layers are downloaded once across both.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: labkiosk
            context: .
            file: Dockerfile
          - name: labkiosk-iso-builder
            context: distro-builder
            file: distro-builder/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Today's date, so the package layer is rebuilt once a day (APT_REFRESH).
      - name: Date the package layer
        id: apt
        run: echo "refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ci/${{ matrix.name }}:pr
          build-args: APT_REFRESH=${{ steps.apt.outputs.refresh }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # The same gate docker-publish.yml applies after pushing, run here so a
      # fixed critical in the base image fails the pull request instead of the
      # release tag.
      - name: Scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci/${{ matrix.name }}:pr
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  worker:
    name: Cloudflare Worker Typecheck & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            cloudflare-control/pnpm-lock.yaml
            cloudflare-email-routing/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm --prefix cloudflare-control install --frozen-lockfile

      - name: TypeScript Typecheck (worker and tests)
        run: pnpm --prefix cloudflare-control run typecheck

      - name: Run Integration Tests
        run: pnpm --prefix cloudflare-control test

      - name: Install Email Worker Dependencies
        run: pnpm --prefix cloudflare-email-routing install --frozen-lockfile

      - name: Email Worker Typecheck & Tests
        run: |
          pnpm --prefix cloudflare-email-routing run typecheck
          pnpm --prefix cloudflare-email-routing test

  client:
    name: Kiosk Client Checks (agent, extension, image scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # PYTHONPYCACHEPREFIX keeps __pycache__ out of config/includes.chroot.
      # live-build copies that tree verbatim into the ISO, so bytecode left here
      # by a syntax check would be shipped inside the image -- built for the
      # runner's interpreter, not the Debian 13 one that would load it.
      - name: Python agent and installer compile
        run: |
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pyc" python3 -m py_compile \
            distro-builder/config/includes.chroot/opt/labkiosk/agent/agent.py \
            distro-builder/config/includes.chroot/usr/local/bin/labkiosk-install \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-localization \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-boot-slots \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-update \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-share \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-logs \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-data-unlock \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-health \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-printing
          if find distro-builder/config/includes.chroot -name '__pycache__' | grep -q .; then
            echo "::error::__pycache__ was written into the image overlay"
            exit 1
          fi

      # The workstation's validators are what stands between a caller and a
      # subprocess, a filesystem path or the browser policy. The control plane
      # has had a suite since the beginning; this is the client's.
      - name: Client validators
        run: |
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pyc" python3 -m unittest discover             -s distro-builder/tests -t distro-builder/tests -v
          if find distro-builder/config/includes.chroot -name '__pycache__' | grep -q .; then
            echo "::error::__pycache__ was written into the image overlay"
            exit 1
          fi

      - name: Extension scripts parse
        run: |
          node --check distro-builder/config/includes.chroot/opt/labkiosk/extension/content.js
          node --check distro-builder/config/includes.chroot/opt/labkiosk/extension/background.js

      - name: Manifest, Chromium policy and language catalogs are valid JSON
        run: |
          python3 - <<'EOF'
          import json, pathlib
          # A catalog with a syntax error would leave the wizard in English with
          # no sign of why, so it is parsed here rather than discovered in a lab.
          for catalog in sorted(pathlib.Path(
                  "distro-builder/config/includes.chroot/opt/labkiosk/i18n").glob("*.json")):
              with open(catalog, encoding="utf-8") as handle:
                  document = json.load(handle)
              assert "_meta" in document, f"{catalog} has no _meta block"
              print("ok", catalog, f"({len(document) - 1} strings)")
          for path in (
              "distro-builder/config/includes.chroot/opt/labkiosk/extension/manifest.json",
              "distro-builder/config/includes.chroot/etc/chromium/policies/managed/policies.json",
              "distro-builder/config/includes.chroot/usr/share/labkiosk/chromium-policy-base.json",
          ):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
              print("ok", path)
          EOF

      # The static Chromium policy is declared once, in chromium-policy-base.json.
      # policies.json is generated from it and committed because the Docker
      # simulator copies that directory directly. This fails if they drift.
      - name: Chromium policy is in step with its base
        run: python3 distro-builder/tools/generate-chromium-policy.py --check

      # Every file below is copied into a Debian rootfs and executed there. A
      # CRLF line ending makes a shell hook die with "$'\r': command not found"
      # and a Python shebang fail to resolve, and Windows checkouts default to
      # core.autocrlf=true -- so this is checked rather than assumed.
      - name: Image scripts use LF line endings
        run: |
          python3 - <<'EOF'
          import pathlib, sys
          roots = [pathlib.Path("distro-builder/config"), pathlib.Path("distro-builder/auto"),
                   pathlib.Path("docker-test")]
          skip = {"chroot", "cache", ".build", "out", "local"}
          bad = []
          for root in roots:
              for p in root.rglob("*"):
                  if not p.is_file() or any(part in skip for part in p.parts):
                      continue
                  if p.suffix.lower() in {".png", ".jpg", ".pf2"}:
                      continue
                  data = p.read_bytes()
                  if b"\x00" not in data[:8192] and b"\r\n" in data:
                      bad.append(str(p))
          if bad:
              print("::error::CRLF line endings in files that run inside the image:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("ok: all image scripts are LF")
          EOF

      # overlayroot reads exactly two variables from /etc/overlayroot.conf --
      # "overlayroot" and "overlayroot_cfgdisk". An overlayroot_options= line is
      # read by nothing, and the recurse default of 1 then overlays EVERY fstab
      # entry with a RAM upper layer, LABKIOSK_DATA included: the workstation
      # enrols, looks fine, and forgets everything at the next power-off.
      - name: overlayroot keeps recurse=0 inside its value
        run: |
          python3 - <<'EOF'
          import pathlib, sys

          targets = [
              "distro-builder/config/includes.chroot/etc/overlayroot.conf",
              "distro-builder/auto/config",
              "distro-builder/config/includes.chroot/usr/local/bin/labkiosk-install",
          ] + [str(p) for p in pathlib.Path("distro-builder/config/bootloaders").rglob("*")
               if p.is_file() and p.suffix not in {".png", ".jpg", ".pf2"}]

          bad = []
          for name in targets:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              for number, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                  if line.lstrip().startswith("#"):
                      continue
                  if "overlayroot_options" in line:
                      bad.append(f"{name}:{number}: overlayroot_options is read by nothing")
                  if "overlayroot=" in line and "recurse=0" not in line:
                      bad.append(f"{name}:{number}: overlayroot= without recurse=0")
          if bad:
              print("::error::overlayroot would overlay the data partition with RAM:")
              for item in bad:
                  print("  " + item)
              sys.exit(1)
          print("ok: every overlayroot setting carries recurse=0")
          EOF

      # shellcheck validates the shell, but a hook that pipes a heredoc into
      # python3 hides a whole second language from it. A mangled escape in one
      # of those blocks is a SyntaxError that surfaces ten minutes into an ISO
      # build, in the chroot stage, and nowhere earlier.
      - name: Embedded python blocks in hooks parse
        run: |
          python3 - <<'EOF'
          import ast, pathlib, re, sys

          pattern = re.compile(r"<<'(\w+)'\n(.*?)\n\1$", re.DOTALL | re.MULTILINE)
          checked = failed = 0
          for hook in sorted(pathlib.Path("distro-builder/config/hooks/live").glob("*.hook.chroot")):
              if not hook.is_file():
                  continue
              text = hook.read_text(encoding="utf-8")
              for marker, body in pattern.findall(text):
                  # Only the blocks that are actually fed to python3.
                  if f"python3 - " not in text.split(f"<<'{marker}'")[0].rsplit("\n", 1)[-1]:
                      continue
                  checked += 1
                  try:
                      ast.parse(body)
                      print(f"ok: {hook} <<{marker}>>")
                  except SyntaxError as err:
                      failed += 1
                      print(f"::error file={hook}::embedded python <<{marker}>> is invalid: {err}")
          if failed:
              sys.exit(1)
          print(f"{checked} embedded python block(s) parsed")
          EOF

      - name: docker-compose.yml is valid
        run: |
          docker compose config --quiet
          echo "ok - docker-compose.yml parses"

      - name: Shell scripts pass shellcheck
        run: |
          shellcheck -S warning \
            distro-builder/config/includes.chroot/etc/openbox/autostart \
            distro-builder/build-iso.sh \
            distro-builder/config/hooks/live/01-lockdown.hook.chroot \
            distro-builder/config/hooks/live/02-security.hook.chroot \
            distro-builder/auto/config \
            distro-builder/auto/build \
            distro-builder/auto/clean \
            distro-builder/docker-build.sh \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-swap \
            distro-builder/config/includes.chroot/usr/local/sbin/labkiosk-hostname \
            distro-builder/config/includes.chroot/etc/NetworkManager/dispatcher.d/50-labkiosk-ntp \
            distro-builder/tests/vm/boot-test.sh \
            distro-builder/tests/vm/live-smoke-test.sh \
            docker-test/entrypoint.sh

  # The control plane is deployed from main by deploy-cloudflare.yml, called
  # here so it runs only after the typecheck and tests above passed on this
  # very commit, instead of running them a second time.
  deploy:
    name: Deploy the control plane
    needs: [changes, worker]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.cloudflare == 'true'))
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-cloudflare.yml
    secrets: inherit
