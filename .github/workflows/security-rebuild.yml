name: Security rebuild

# Over-the-air updates, phase 4 (docs/OTA_UPDATES.md section 7). Every day,
# for every release line that updates over the air, whose major release the
# platform has not put at end of life and that no newer line of its major
# classified stable supersedes (the controller's GET /api/release-support:
# once 3.1.0 is stable, 3.0 is rebuilt no more), compare the
# packages of the line's newest release with the Debian security archive. When
# one of them has a fix, rebuild that release's own source -- unchanged but for
# its version, the next patch that no tag and no R2 release has -- so
# live-build installs the fixed packages, boot-test it, sign it as a `security`
# release of its base, and publish it to R2 like build-iso.yml does. Its GitHub release carries the notes and the image's
# package list, but no ISO: workstations download the image from R2, and a new
# install starts from the newest feature release's ISO and takes the security
# release when it is offered. A security release needs no classification: the
# controller records it when this run announces it and offers it at once, in
# the Releases page's Security section; organizations install it at their
# workstations' next start, or approve it.
#
# Each line is rebuilt for every architecture its source builds (amd64 alone
# up to 4.x; amd64 and arm64 from Debian 13 on), each on a runner of its own
# architecture, against its own Debian release's security suite. A line is
# rebuilt on every architecture when any of them has a fix: the release is one
# version everywhere. The jobs: plan (which lines and builds), check (one per
# build: is anything outdated?), decide, build (one per build: bump, build,
# check), smoke-test (the live image of every architecture but amd64),
# boot-test (one per group of the release's own boot test, in parallel, on
# the amd64 ISO), publish (one per line, once every build, smoke test and
# boot test passed: sign each architecture, upload, tag, announce).
#
# The decisions -- which lines, which builds, which packages, the version
# bump, the notes -- are distro-builder/tools/security-rebuild.py, tested in
# distro-builder/tests/test_security_rebuild.py. The build, sign and publish
# steps are build-iso.yml's, run on the rebuilt source.
#
# The tag is pushed with GITHUB_TOKEN, which starts no other workflow: build-iso
# never builds a security release a second time.

on:
  schedule:
    # 00:30 UTC is 06:00 in Asia/Kolkata, before the working day.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      line:
        description: "Only this release line, such as 2.9 (empty: every line of a major not at end of life that no newer stable line supersedes)"
        required: false
        default: ""
      force:
        description: "Rebuild even when no installed package has a security update"
        type: boolean
        default: false
      dry_run:
        description: "Build and boot-test, but sign and publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-rebuild
  cancel-in-progress: false

jobs:
  plan:
    name: Choose the release lines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.builds.outputs.builds }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # Only the lines of major releases the platform has not ended get
      # security rebuilds, and of each major only its newest stable line and
      # any newer one. A policy that cannot be read stops the run: it never
      # falls back to rebuilding a major a super admin put at end of life.
      - name: Read which major releases are at end of life and which are stable
        env:
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          CONTROLLER_URL: ${{ vars.CONTROLLER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_NOTES_TOKEN:-}" ] || [ -z "${CONTROLLER_URL:-}" ]; then
            echo "::error::RELEASE_NOTES_TOKEN and CONTROLLER_URL tell this run which major releases are at end of life, and one is not set. See distro-builder/README.md 'Over-the-air releases'."
            exit 1
          fi
          case "$CONTROLLER_URL" in
            https://*) ;;
            *) echo "::error::CONTROLLER_URL must be the controller's https:// address, such as https://labkiosk.org."; exit 1 ;;
          esac
          policy="$RUNNER_TEMP/release-support.json"
          status="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -o "$policy" -w '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_NOTES_TOKEN" "${CONTROLLER_URL%/}/api/release-support")" || status="000"
          if [ "$status" != "200" ]; then
            echo "::error::The controller answered $status to GET /api/release-support; no line is rebuilt without knowing which majors are at end of life."
            exit 1
          fi
          jq . "$policy"

      # The versions already in R2. A run that uploaded its release and then
      # could not push its tag leaves one there; the controller keeps the first
      # manifest it reads for a version, so the next rebuild of that line takes
      # the patch after it instead of building the same version again.
      - name: Read which versions are already published
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
          PUBLISH: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/published.txt"
          : > "$published"
          missing=""
          for name in R2_ACCESS_KEY_ID:AWS_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY:AWS_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID:CLOUDFLARE_ACCOUNT_ID R2_RELEASES_BUCKET:R2_RELEASES_BUCKET; do
            if [ -z "$(printenv "${name#*:}")" ]; then missing="$missing ${name%%:*}"; fi
          done
          if [ -n "$missing" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::A rebuild that publishes must know the versions already in R2, and these are not set:$missing. See distro-builder/README.md 'Over-the-air releases'."
              exit 1
            fi
            echo "::warning::Dry run without R2 settings ($missing): versions are chosen from the tags alone."
            exit 0
          fi
          listing="$(aws s3api list-objects-v2 --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --bucket "$R2_RELEASES_BUCKET" --prefix releases/ --delimiter / \
            --query 'CommonPrefixes[].Prefix' --output text)"
          # An empty bucket answers "None"; the planner refuses any other line that is not a version.
          printf '%s\n' "$listing" | tr '\t' '\n' | { grep -v -e '^None$' -e '^$' || true; } > "$published"
          echo "Published in R2: $(tr '\n' ' ' < "$published")"

      - name: List the lines and their newest releases
        id: lines
        env:
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          args=(--policy "$RUNNER_TEMP/release-support.json" --published "$RUNNER_TEMP/published.txt")
          if [ -n "${LINE:-}" ]; then args+=(--line "$LINE"); fi
          mapfile -t tags < <(git tag --list 'v*' 'V*')
          python3 distro-builder/tools/security-rebuild.py lines "${args[@]}" "${tags[@]}" > "$RUNNER_TEMP/lines.json"
          jq . "$RUNNER_TEMP/lines.json"

      # Each line is built for every architecture its own source builds, on
      # that source's Debian release: a 4.x line is bookworm and amd64 alone.
      # Every build of this run commits its version bump at the same time, so
      # the builds of a line on different runners make the very same commit.
      - name: List the builds of each line
        id: builds
        run: |
          set -euo pipefail
          builds="$(python3 distro-builder/tools/security-rebuild.py builds --lines "$RUNNER_TEMP/lines.json" \
            --repo . --epoch "$(date -u +%s)")"
          echo "$builds" | jq .
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  check:
    name: Check ${{ matrix.tag }} (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.builds) }}

    steps:
      - name: Checkout the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools

      # The packages of the line's newest release, read once and kept: a release
      # never changes after it is published. A release publishes its package
      # list as `dpkg-status` (amd64's) and `dpkg-status-<arch>`; one from
      # before that, only its ISO.
      - name: Cache the packages of ${{ matrix.tag }}
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/base/status
          key: security-rebuild-dpkg-status-${{ matrix.tag }}-${{ matrix.arch }}

      - name: Read the packages of ${{ matrix.tag }}
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
          ISO: ${{ matrix.iso }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/base"
          mkdir -p "$work"
          asset=dpkg-status
          [ "$ARCH" = amd64 ] || asset="dpkg-status-$ARCH"
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -qx "$asset" <<< "$assets"; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$work" --pattern "$asset"
            mv "$work/$asset" "$work/status"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$work" \
            --pattern "$ISO" --pattern "$ISO.sha256"
          (cd "$work" && sha256sum -c "$ISO.sha256")
          xorriso -osirrox on -indev "$work/$ISO" -extract /live/filesystem.squashfs "$work/filesystem.squashfs" >/dev/null 2>&1
          unsquashfs -no-xattrs -d "$work/root" "$work/filesystem.squashfs" var/lib/dpkg/status >/dev/null
          mv "$work/root/var/lib/dpkg/status" "$work/status"
          rm -rf "${work:?}/root" "${work:?}/filesystem.squashfs" "${work:?}/$ISO" "${work:?}/$ISO.sha256"

      - name: Look for security updates
        env:
          SUITE: ${{ matrix.suite }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          python3 distro-builder/tools/security-rebuild.py check --status "$RUNNER_TEMP/base/status" \
            --mirror https://deb.debian.org/debian-security --suite "$SUITE" --architecture "$ARCH" \
            > "$RUNNER_TEMP/check.json"
          count="$(jq '.outdated | length' "$RUNNER_TEMP/check.json")"
          jq -r '.outdated[] | "\(.package) \(.installed) -> \(.available)"' "$RUNNER_TEMP/check.json"
          echo "${{ matrix.tag }} ($ARCH): $count packages have a security update in $SUITE."
          mkdir -p "$RUNNER_TEMP/decision"
          cp "$RUNNER_TEMP/base/status" "$RUNNER_TEMP/decision/base-status"
          jq -n --arg version "$VERSION" --arg arch "$ARCH" --argjson outdated "$count" \
            '{version: $version, arch: $arch, outdated: $outdated}' > "$RUNNER_TEMP/decision/$VERSION-$ARCH.json"

      # The answer, for decide, and the base's package list, for the notes.
      - name: Keep the answer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decision-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/decision/
          if-no-files-found: error
          retention-days: 7

  decide:
    name: Choose what to rebuild
    needs: [plan, check]
    # A line whose check failed is left out, and that check has failed the run;
    # the other lines go on.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.decide.outputs.builds }}
      lines: ${{ steps.decide.outputs.lines }}
      boot_tests: ${{ steps.decide.outputs.boot_tests }}
      smoke_tests: ${{ steps.decide.outputs.smoke_tests }}
    steps:
      - name: Checkout the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect the checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: decision-*
          path: ${{ runner.temp }}/decisions

      - name: Rebuild a line when any of its architectures has a fix
        id: decide
        env:
          BUILDS: ${{ needs.plan.outputs.builds }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          answers="$RUNNER_TEMP/answers"
          mkdir -p "$answers" "$RUNNER_TEMP/decisions"
          find "$RUNNER_TEMP/decisions" -name '*.json' -exec cp {} "$answers/" \;
          printf '%s' "$BUILDS" > "$RUNNER_TEMP/builds.json"
          args=(--builds "$RUNNER_TEMP/builds.json" --decisions "$answers")
          if [ "${FORCE:-false}" = "true" ]; then args+=(--force); fi
          decided="$(python3 distro-builder/tools/security-rebuild.py decide "${args[@]}")"
          echo "$decided" | jq .
          {
            echo "### Security rebuild"
            if [ "$(jq '.lines | length' <<< "$decided")" -eq 0 ]; then
              echo "Every line checked is current with the Debian security archive; nothing is rebuilt."
            fi
            jq -r '.lines[] | "- \(.tag) is rebuilt as v\(.version) for \(.architectures | join(", "))."' <<< "$decided"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "builds=$(jq -c .builds <<< "$decided")" >> "$GITHUB_OUTPUT"
          echo "lines=$(jq -c .lines <<< "$decided")" >> "$GITHUB_OUTPUT"
          echo "boot_tests=$(jq -c .bootTests <<< "$decided")" >> "$GITHUB_OUTPUT"
          echo "smoke_tests=$(jq -c .smokeTests <<< "$decided")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.version }} (${{ matrix.arch }})
    needs: decide
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.builds != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.decide.outputs.builds) }}
    env:
      ISO: ${{ matrix.iso }}

    steps:
      - name: Checkout the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout ${{ matrix.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          path: rebuild-src

      - name: Install the image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools

      # The release's own source with one change: its version, in the four files
      # that carry it (and the default branch's workflows, below). Committed now
      # so the build's SOURCE_DATE_EPOCH names the exact tree that was built. The
      # publish job makes the same commit again, at the same time, and tags it
      # once every architecture is built.
      - name: Bump ${{ matrix.base }} to ${{ matrix.version }}
        env:
          EPOCH: ${{ matrix.epoch }}
        run: |
          set -euo pipefail
          python3 distro-builder/tools/security-rebuild.py bump --root rebuild-src \
            --from "${{ matrix.base }}" --to "${{ matrix.version }}"
          # The workflows of the default branch, not the base's: GitHub refuses
          # a tag pushed with GITHUB_TOKEN whose workflow files differ from the
          # default branch's ("without `workflows` permission"). They are not in
          # the image, so the release is the same either way.
          rm -rf rebuild-src/.github/workflows
          mkdir -p rebuild-src/.github
          cp -a .github/workflows rebuild-src/.github/workflows
          cd rebuild-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          GIT_AUTHOR_DATE="@$EPOCH +0000" GIT_COMMITTER_DATE="@$EPOCH +0000" \
            git commit --quiet --message "chore(release): v${{ matrix.version }}, a security rebuild of ${{ matrix.tag }}"
          git log -1 --stat

      # As build-iso.yml: deleting the toolchains takes minutes, so only when
      # the runner is short of room.
      - name: Free disk space on the runner (only if needed)
        env:
          NEED_GIB: 15
        run: |
          df -h / /mnt
          free_gib=$(( $(df --output=avail -B1G / | tail -1) ))
          if [ "$free_gib" -ge "$NEED_GIB" ]; then
            echo "/ has $free_gib GiB free, enough for the build ($NEED_GIB GiB): nothing deleted."
            exit 0
          fi
          echo "/ has $free_gib GiB free, under $NEED_GIB GiB: deleting preinstalled toolchains."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The builder image of the rebuilt source: the Dockerfile COPYs the source
      # in, so it is built from that tree and nothing else.
      - name: Build the ISO builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rebuild-src/distro-builder
          file: rebuild-src/distro-builder/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ghcr.io/akbhoi/labkiosk-iso-builder:security-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch == 'amd64' && 'labkiosk-iso-builder' || format('labkiosk-iso-builder-{0}', matrix.arch) }}

      # ISO_NAME and LABKIOSK_ARCH are the names both a 4.x and a later builder
      # read; a 4.x builder ignores the second.
      - name: Compile the ISO
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p rebuild-src/distro-builder/out
          docker run --privileged --rm -e ISO_NAME="$ISO" -e LABKIOSK_ARCH="$ARCH" \
            -v "$PWD/rebuild-src/distro-builder/out:/build/out" \
            "ghcr.io/akbhoi/labkiosk-iso-builder:security-$ARCH"

      - name: Verify the checksum
        working-directory: rebuild-src/distro-builder/out
        run: |
          cat "$ISO.sha256"
          sha256sum -c "$ISO.sha256"
          ls -lh "$ISO"

      # The point of the rebuild: refuse an image that still lacks a fix the
      # archive has, as one built without the security archive would.
      - name: Check the rebuilt image is current
        env:
          SUITE: ${{ matrix.suite }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rebuilt"
          rm -rf "${work:?}"
          mkdir -p "$work"
          xorriso -osirrox on -indev "rebuild-src/distro-builder/out/$ISO" \
            -extract /live/vmlinuz "$work/vmlinuz" \
            -extract /live/initrd.img "$work/initrd.img" \
            -extract /live/filesystem.squashfs "$work/filesystem.squashfs" >/dev/null 2>&1
          unsquashfs -no-xattrs -d "$work/root" "$work/filesystem.squashfs" var/lib/dpkg/status >/dev/null
          mv "$work/root/var/lib/dpkg/status" "$work/dpkg-status"
          rm -rf "${work:?}/root"
          python3 distro-builder/tools/security-rebuild.py check --status "$work/dpkg-status" \
            --mirror https://deb.debian.org/debian-security --suite "$SUITE" --architecture "$ARCH" \
            --fail-if-outdated > "$work/check.json"
          git -C rebuild-src rev-parse HEAD > "$work/commit"

      # The release's own boot test knows that release's behaviour, but not the
      # fixes made to the test itself since the release was tagged. Those are
      # distro-builder/tests/vm/release-fixes/*.patch on the default branch,
      # applied to the release's test after its image is built, and never
      # committed: they change the test only, never the image or the tag. A
      # fix the release already carries is skipped; one that fits neither way
      # stops the run, so a check it repairs never runs unrepaired. A fix to a
      # part of the test that came later starts with "Since: v<version>" and
      # is left out of an older release.
      - name: Bring the boot test's own fixes into ${{ matrix.tag }}
        if: matrix.arch == 'amd64'
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch in "$PWD"/distro-builder/tests/vm/release-fixes/*.patch; do
            name="$(basename "$patch")"
            since="$(sed -n '1s/^Since: v\([0-9][0-9.]*\)$/\1/p' "$patch")"
            if [ -n "$since" ] && [ "$(printf '%s\n%s\n' "$since" "$BASE" | sort -V | head -n 1)" != "$since" ]; then
              echo "$name is for v$since and later, not ${{ matrix.tag }}."
              continue
            fi
            if git -C rebuild-src apply --check "$patch" 2>/dev/null; then
              git -C rebuild-src apply "$patch"
              echo "Applied $name to ${{ matrix.tag }}'s boot test."
            elif git -C rebuild-src apply --check --reverse "$patch" 2>/dev/null; then
              echo "${{ matrix.tag }} already has $name."
            else
              echo "::error::$name applies to ${{ matrix.tag }}'s boot test neither forwards nor in reverse. Rebase it onto that release's distro-builder/tests/vm/."
              exit 1
            fi
          done

      # The ISO is tested in jobs of its own, as build-iso.yml tests it: the
      # amd64 one by the boot-test jobs, one per group of the release's own
      # test, every other one by a smoke-test job. They get the ISO and the
      # tests as they stand here: the release's, with the fixes above. A
      # tarball keeps the scripts executable. The artifact's name has no
      # "-<version>-", so the publish job's download leaves it out.
      - name: Pack the ISO and its tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-input"
          mv "rebuild-src/distro-builder/out/$ISO" "rebuild-src/distro-builder/out/$ISO.sha256" "$RUNNER_TEMP/test-input/"
          tar -C rebuild-src -cf "$RUNNER_TEMP/test-input/test-src.tar" distro-builder/tests distro-builder/tools

      - name: Keep the ISO for its tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-input-v${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/test-input/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      # What the publish job signs and uploads: the live system, its package
      # list and the commit it was built from. Uploaded last, so a build that
      # failed any step above leaves nothing to publish.
      - name: Keep the rebuilt release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-${{ matrix.version }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/rebuilt/vmlinuz
            ${{ runner.temp }}/rebuilt/initrd.img
            ${{ runner.temp }}/rebuilt/filesystem.squashfs
            ${{ runner.temp }}/rebuilt/dpkg-status
            ${{ runner.temp }}/rebuilt/commit
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Every architecture but amd64: the release's own live smoke test, as
  # build-iso.yml runs it on a feature release, beside the boot test.
  smoke-test:
    name: Smoke test ${{ matrix.version }} (${{ matrix.arch }})
    needs: [decide, build]
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.smoke_tests != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.decide.outputs.smoke_tests) }}
    env:
      ISO: ${{ matrix.iso }}

    steps:
      # A build that failed uploaded nothing, so this fails too and its line
      # is not published.
      - name: Collect the ISO and its smoke test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-input-v${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/input

      - name: Unpack the smoke test of ${{ matrix.tag }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/input" && sha256sum -c "$ISO.sha256")
          mkdir -p rebuild-src
          tar -C rebuild-src -xf "$RUNNER_TEMP/input/test-src.tar"

      - name: Smoke-test the live image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm xorriso
          sudo SMOKE_TIMEOUT=1800 rebuild-src/distro-builder/tests/vm/live-smoke-test.sh \
            "$RUNNER_TEMP/input/$ISO" "$RUNNER_TEMP/smoke"

      - name: Upload the smoke test's serial log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-serial-v${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke/serial.log
          if-no-files-found: ignore
          retention-days: 7

      # What the publish job checks for: this architecture's live image booted.
      - name: Record the pass
        run: |
          mkdir -p "$RUNNER_TEMP/passed"
          echo "${{ matrix.version }} ${{ matrix.arch }}" > "$RUNNER_TEMP/passed/${{ matrix.arch }}"

      - name: Keep the pass
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-tested-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/passed/
          if-no-files-found: error
          retention-days: 7

  # The release's own boot test of the amd64 build, one job per group of it,
  # as build-iso.yml runs a feature release's: the groups boot the installed
  # disk independently, so together they take as long as the longest one.
  boot-test:
    name: Boot test ${{ matrix.version }} (${{ matrix.name }})
    needs: [decide, build]
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.boot_tests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.decide.outputs.boot_tests) }}
    env:
      ISO: ${{ matrix.iso }}

    steps:
      # A build that failed uploaded nothing, so this fails too and its line
      # is not published.
      - name: Collect the ISO and its boot test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-input-v${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/input

      - name: Unpack the boot test of ${{ matrix.tag }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/input" && sha256sum -c "$ISO.sha256")
          mkdir -p rebuild-src
          tar -C rebuild-src -xf "$RUNNER_TEMP/input/test-src.tar"

      # An empty group runs the whole test: a release's test from before
      # BOOT_TEST_GROUPS.
      - name: Boot-test the installed disk (${{ matrix.name }})
        env:
          GROUP: ${{ matrix.group }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso squashfs-tools \
            swtpm cryptsetup-bin dosfstools python3-virt-firmware
          if [ -n "$GROUP" ]; then export BOOT_TEST_GROUPS="$GROUP"; fi
          sudo --preserve-env=BOOT_TEST_GROUPS rebuild-src/distro-builder/tests/vm/boot-test.sh \
            "$RUNNER_TEMP/input/$ISO" "$RUNNER_TEMP/boot-test"

      - name: Upload the boot test's screens
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-test-screens-v${{ matrix.version }}-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/boot-test/*.ppm
            ${{ runner.temp }}/boot-test/*.log
            ${{ runner.temp }}/boot-test/preset-live/serial.log
          if-no-files-found: ignore
          retention-days: 7

      # What the publish job checks for: this group passed on this version.
      - name: Record the pass
        run: |
          mkdir -p "$RUNNER_TEMP/passed"
          echo "${{ matrix.version }} ${{ matrix.name }}" > "$RUNNER_TEMP/passed/${{ matrix.name }}"

      - name: Keep the pass
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-tested-${{ matrix.version }}-${{ matrix.name }}
          path: ${{ runner.temp }}/passed/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Line ${{ matrix.line }} (${{ matrix.tag }})
    needs: [decide, build, smoke-test, boot-test]
    # A line is published when every one of its architectures was built; a
    # build that failed leaves its own line unpublished, not the others.
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.lines != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Two lines rebuilt on the same day publish one after the other.
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.decide.outputs.lines) }}
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
      ARCHITECTURES: ${{ join(matrix.architectures, ' ') }}
      BOOT_TEST_GROUPS: ${{ join(matrix.bootTestGroups, ' ') }}

    steps:
      - name: Checkout the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout ${{ matrix.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.tag }}
          path: rebuild-src

      - name: Collect the builds and the checks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-${{ matrix.version }}-*"
          path: ${{ runner.temp }}/artifacts

      # Each architecture's build must be there, and have built the commit
      # this job makes: the same bump of the same tag, at the same time.
      - name: Make the commit of v${{ matrix.version }}
        env:
          EPOCH: ${{ matrix.epoch }}
        run: |
          set -euo pipefail
          python3 distro-builder/tools/security-rebuild.py bump --root rebuild-src \
            --from "${{ matrix.base }}" --to "${{ matrix.version }}"
          rm -rf rebuild-src/.github/workflows
          mkdir -p rebuild-src/.github
          cp -a .github/workflows rebuild-src/.github/workflows
          cd rebuild-src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          GIT_AUTHOR_DATE="@$EPOCH +0000" GIT_COMMITTER_DATE="@$EPOCH +0000" \
            git commit --quiet --message "chore(release): v${{ matrix.version }}, a security rebuild of ${{ matrix.tag }}"
          commit="$(git rev-parse HEAD)"
          for arch in $ARCHITECTURES; do
            built="$RUNNER_TEMP/artifacts/rebuild-${{ matrix.version }}-$arch/commit"
            if [ ! -f "$built" ]; then
              echo "::error::The $arch build of v${{ matrix.version }} did not finish; the line is not published."
              exit 1
            fi
            if [ "$(cat "$built")" != "$commit" ]; then
              echo "::error::The $arch build of v${{ matrix.version }} built $(cat "$built"), not $commit."
              exit 1
            fi
          done
          # Every architecture but amd64 passed its live smoke test.
          for arch in $ARCHITECTURES; do
            if [ "$arch" != amd64 ] && [ ! -f "$RUNNER_TEMP/artifacts/smoke-tested-${{ matrix.version }}-$arch/$arch" ]; then
              echo "::error::The $arch smoke test of v${{ matrix.version }} did not pass; the line is not published."
              exit 1
            fi
          done
          # Every group of the amd64 boot test passed (one "all" job for a test without groups).
          groups="$BOOT_TEST_GROUPS"
          for group in ${groups:-all}; do
            if [ ! -f "$RUNNER_TEMP/artifacts/boot-tested-${{ matrix.version }}-$group/$group" ]; then
              echo "::error::The $group boot test of v${{ matrix.version }} did not pass; the line is not published."
              exit 1
            fi
          done
          GIT_COMMITTER_DATE="@$EPOCH +0000" git tag --annotate "v${{ matrix.version }}" \
            --message "Lab Kiosk v${{ matrix.version }}: security rebuild of ${{ matrix.tag }}"
          git log -1 --format='%H %s'

      - name: Write the release notes
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/artifacts"
          args=()
          for arch in $ARCHITECTURES; do
            args+=(--base-status "$artifacts/decision-${{ matrix.version }}-$arch/base-status")
            args+=(--new-status "$artifacts/rebuild-${{ matrix.version }}-$arch/dpkg-status")
          done
          python3 distro-builder/tools/security-rebuild.py notes --base-tag "${{ matrix.tag }}" \
            --version "${{ matrix.version }}" "${args[@]}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          # The next run's base for this line: dpkg-status is amd64's, as before
          # arm64; every other architecture's carries its name.
          mkdir -p "$RUNNER_TEMP/package-lists"
          for arch in $ARCHITECTURES; do
            name=dpkg-status
            [ "$arch" = amd64 ] || name="dpkg-status-$arch"
            cp "$artifacts/rebuild-${{ matrix.version }}-$arch/dpkg-status" "$RUNNER_TEMP/package-lists/$name"
          done

      # Checked before anything is signed, so a rebuild missing its key or its
      # bucket fails in seconds.
      - name: Check the over-the-air release settings
        if: env.PUBLISH == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          CONTROLLER_URL: ${{ vars.CONTROLLER_URL }}
        run: |
          missing=""
          for name in UPDATE_SIGNING_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID R2_RELEASES_BUCKET RELEASE_NOTES_TOKEN CONTROLLER_URL; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::A security release is signed, uploaded to R2 and announced to the controller, and these are not set:$missing. See distro-builder/README.md 'Over-the-air releases'."
            exit 1
          fi
          case "$CONTROLLER_URL" in
            https://*) ;;
            *) echo "::error::CONTROLLER_URL must be the controller's https:// address, such as https://labkiosk.org."; exit 1 ;;
          esac

      # As build-iso.yml signs a release, with two differences: the manifest says
      # `security` and names the release it rebuilds, which is what lets a
      # workstation on that line install it at its next start. Each
      # architecture's manifest is signed on its own, and verified against the
      # keys the rebuilt source carries.
      - name: Sign the security release
        if: env.PUBLISH == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PASSPHRASE: ${{ secrets.UPDATE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          share=rebuild-src/distro-builder/config/includes.chroot/usr/share/labkiosk
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'gpgconf --kill gpg-agent; rm -rf "${GNUPGHOME:?}"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" | gpg --batch --import
          keyrings=()
          for keyring in "$share"/update-keys/*.gpg; do keyrings+=(--keyring "$PWD/$keyring"); done
          for arch in $ARCHITECTURES; do
            release="$RUNNER_TEMP/release/$arch"
            mkdir -p "$release"
            for name in vmlinuz initrd.img filesystem.squashfs; do
              cp "$RUNNER_TEMP/artifacts/rebuild-${{ matrix.version }}-$arch/$name" "$release/$name"
            done
            # amd64's manifest names no architecture, as every manifest before arm64.
            architecture=()
            [ "$arch" = amd64 ] || architecture=(--architecture "$arch")
            SOURCE_DATE_EPOCH="${{ matrix.epoch }}" python3 distro-builder/tools/make-release-manifest.py \
              --live "$release" --version "${{ matrix.version }}" \
              --security-floor "$(tr -d '[:space:]' < "$share/security-floor")" \
              --channel stable --kind security --base-version "${{ matrix.base }}" "${architecture[@]}" \
              --out "$release/manifest.json"
            printf '%s' "${UPDATE_SIGNING_PASSPHRASE:-}" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --detach-sign --output "$release/manifest.json.sig" "$release/manifest.json"
            GNUPGHOME="$(mktemp -d)" gpgv "${keyrings[@]}" "$release/manifest.json.sig" "$release/manifest.json"
            ls -l "$release"
          done

      # amd64 at the folder's root, where 4.x looks; every other architecture
      # in a subfolder of its name, uploaded first, because the controller
      # records a release's architectures when it first sees the root
      # manifest. The manifest goes last in each folder.
      - name: Upload the security release to R2
        if: env.PUBLISH == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="releases/${{ matrix.version }}"
          if found="$(aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_RELEASES_BUCKET" \
                        --key "$prefix/manifest.json" 2>&1)"; then
            echo "::error::$prefix was published in R2 after this run chose its version. Run this workflow again: it takes the next free version."
            exit 1
          elif ! printf '%s' "$found" | grep -q '(404)'; then
            echo "::error::Could not check R2 for $prefix: $found"
            exit 1
          fi
          read -r -a others <<< "${ARCHITECTURES//amd64/}"
          for arch in "${others[@]}" amd64; do
            folder="$prefix"
            [ "$arch" = amd64 ] || folder="$prefix/$arch"
            for name in vmlinuz initrd.img filesystem.squashfs manifest.json.sig manifest.json; do
              aws s3 cp --no-progress --endpoint-url "$endpoint" \
                "$RUNNER_TEMP/release/$arch/$name" "s3://$R2_RELEASES_BUCKET/$folder/$name"
            done
          done

      # A tag of its own, on a commit no branch carries: the source of exactly
      # this release. Pushed after R2 has the release, so a tag never names a
      # release that is not there.
      - name: Push the tag v${{ matrix.version }}
        if: env.PUBLISH == 'true'
        working-directory: rebuild-src
        run: git push origin "refs/tags/v${{ matrix.version }}"

      # The record of what changed, without an ISO: workstations take the image
      # from R2. The package lists are the next run's base for this line.
      # "Latest" on GitHub, which /download links before it knows any release,
      # stays the newest release that has an ISO.
      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ matrix.version }}
          name: "Lab Kiosk v${{ matrix.version }} (security)"
          body_path: ${{ runner.temp }}/notes.md
          make_latest: "false"
          files: ${{ runner.temp }}/package-lists/dpkg-status*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: List the release on the download page
        if: env.PUBLISH == 'true'
        env:
          RELEASE_NOTES_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          CONTROLLER_URL: ${{ vars.CONTROLLER_URL }}
          TAG: v${{ matrix.version }}
          NEWEST: ${{ matrix.newest }}
        run: |
          set -euo pipefail
          answer="$RUNNER_TEMP/release-notes-sync.json"
          for attempt in 1 2 3 4 5 6; do
            reply="$(curl -sS --max-time 30 -o "$answer" -w '%{http_code} %{redirect_url}' -X POST \
              -H "Authorization: Bearer $RELEASE_NOTES_TOKEN" "${CONTROLLER_URL%/}/api/release-notes/sync")" || reply="000 "
            status="${reply%% *}"
            case "$status" in
              301|302|303|307|308)
                # A redirect turns the POST into a GET, or drops it: the address itself is wrong.
                echo "::error::$CONTROLLER_URL redirects ($status to ${reply#* }). Set the CONTROLLER_URL variable to the address that answers without a redirect. The release is published; /download lists it after the next hourly run."
                exit 1 ;;
              200)
                latest="$(jq -r '.latest // empty' "$answer")"
                if [ "$NEWEST" != "true" ]; then
                  # /download lists releases by version; an older line's rebuild is listed below the newest.
                  echo "/download read the releases again (newest: ${latest:-none})."
                  exit 0
                fi
                if [ "$latest" = "$TAG" ]; then
                  echo "/download now lists $latest; its ISO stays the newest feature release's."
                  exit 0
                fi
                echo "GitHub does not list $TAG yet (newest: ${latest:-none})." ;;
              401|503)
                echo "::error::The controller refused the request ($status): RELEASE_NOTES_TOKEN must match the Worker's secret of the same name. The release is published; /download lists it after the next hourly run."
                exit 1 ;;
              *)
                echo "The controller answered $status (attempt $attempt)." ;;
            esac
            sleep 10
          done
          echo "::error::/download does not list $TAG yet. The release is published; the hourly run lists it within the hour."
          exit 1

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Line ${{ matrix.line }} (${{ matrix.tag }}): $ARCHITECTURES"
            if [ "$OUTCOME" != "success" ]; then
              echo "v${{ matrix.version }} was not published: see the failed step."
            elif [ "$PUBLISH" != "true" ]; then
              echo "Dry run: v${{ matrix.version }} was built and boot-tested, and nothing was published."
            else
              echo "v${{ matrix.version }} is published and offered to the workstations on its line; the Super Admin console lists it under Releases → Security."
            fi
            if [ -s "$RUNNER_TEMP/notes.md" ]; then echo; cat "$RUNNER_TEMP/notes.md"; fi
          } >> "$GITHUB_STEP_SUMMARY"
