name: Publish Docker Images to GitHub Packages

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

# Deliberately NOT filtered by `paths`. A docs-only push to main does rebuild
# both images, but the layer cache below makes that a cache hit rather than a
# fresh apt install -- and a path filter risks a release tag silently not
# publishing, which is a far worse failure than a couple of cheap runs.

permissions:
  contents: read
  packages: write
  # Keyless cosign signing exchanges this token for a short-lived certificate,
  # so the signature is tied to this workflow rather than to a stored key.
  id-token: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # One job per image and platform, each on a runner of that architecture:
    # arm64 is built natively on GitHub's arm64 runner (free for public
    # repositories) instead of through QEMU emulation, which took most of the
    # run. Each job pushes its image by digest only; `publish` below joins the
    # platforms of an image under its tags.
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium exists for both, and the simulator is the image people run
          # on whatever hardware they have (Apple Silicon, a Raspberry Pi).
          - name: labkiosk
            image: ghcr.io/${{ github.repository }}
            context: .
            file: Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            # Shared with ci.yml, which builds the same image on pull requests.
            cache: labkiosk
          - name: labkiosk
            image: ghcr.io/${{ github.repository }}
            context: .
            file: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            cache: labkiosk-arm64
          # amd64 only, deliberately: it builds an amd64 Debian image with
          # debootstrap, so an arm64 variant would have nothing to do.
          - name: labkiosk-iso-builder
            image: ghcr.io/${{ github.repository }}-iso-builder
            context: distro-builder
            file: distro-builder/Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            cache: labkiosk-iso-builder

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before anything is pushed: a tag on a commit whose version was never
      # bumped would publish the old code as the new version, and :latest with it.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(tr -d '[:space:]' < distro-builder/config/includes.chroot/usr/share/labkiosk/version)"
          tag="${GITHUB_REF_NAME#[vV]}"
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match usr/share/labkiosk/version ($version)."
            exit 1
          fi

      # Today's date, so the package layer is rebuilt once a day (APT_REFRESH).
      - name: Date the package layer
        id: apt
        run: echo "refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}

      - name: Build and push ${{ matrix.name }} (${{ matrix.arch }}) by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Attestations: what built this image, and what is inside it. GHCR
          # shows both, and `cosign verify-attestation` can check them. They
          # travel into the multi-platform index that `publish` creates.
          provenance: mode=max
          sbom: true
          # Layer cache keyed per image and platform. The apt layer in each of
          # these is hundreds of megabytes and changes rarely; without a cache
          # every run re-downloaded and re-installed all of it. APT_REFRESH
          # still rebuilds it once a day, so the cache never holds back a
          # security fix.
          build-args: APT_REFRESH=${{ steps.apt.outputs.refresh }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::The build reported no digest ('$DIGEST')."; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.name }} (GHCR)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: labkiosk
            image: ghcr.io/${{ github.repository }}
            platforms: 2
          - name: labkiosk-iso-builder
            image: ghcr.io/${{ github.repository }}-iso-builder
            platforms: 1

    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*-${{ matrix.name }}
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      # A platform whose build job failed leaves no digest: publishing the
      # others under the tags would silently drop it, so the count is checked.
      - name: Check every platform was built
        working-directory: ${{ runner.temp }}/digests
        env:
          EXPECTED: ${{ matrix.platforms }}
        run: |
          found="$(find . -maxdepth 1 -type f -name '[0-9a-f]*' | wc -l)"
          if [ "$found" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED platform digest(s) for ${{ matrix.name }}, found $found: $(ls)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # A release tag also publishes 1.4.2, 1.4 and 1, so an organization can pin
            # a line that receives fixes instead of following :latest.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      # One index for every tag, listing each platform's image (and its
      # attestations) by the digest its build job pushed.
      - name: Join the platforms under the tags
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::metadata-action produced no tags."; exit 1; }
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          first_tag="$(head -n 1 <<< "$TAGS")"
          docker buildx imagetools inspect "$first_tag"
          digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r '.digest')"
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not read the digest of $first_tag ('$digest')."; exit 1 ;;
          esac

      # Signed keylessly against this workflow's OIDC identity. Verify with:
      #   cosign verify ghcr.io/<owner>/labkiosk \
      #     --certificate-identity-regexp '^https://github.com/<owner>/labkiosk/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the published image
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"

      # Advisory by design, except for critical fixed vulnerabilities. Chromium
      # always carries open high-severity CVEs, so failing on those would mean
      # never publishing; failing on fixed criticals catches the case that
      # matters -- a base image that is simply out of date.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.index.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
