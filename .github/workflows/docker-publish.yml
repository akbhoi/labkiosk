name: Publish Docker Images to GitHub Packages

on:
  push:
    tags:
      - 'v*'
      - 'V*'
    branches:
      - main
  workflow_dispatch:

# Deliberately NOT filtered by `paths`. A docs-only push to main does rebuild
# both images, but the layer cache below makes that a cache hit rather than a
# fresh apt install -- and a path filter risks a release tag silently not
# publishing, which is a far worse failure than a couple of cheap runs.

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Both images are built the same way; only the context, file and name
    # differ. This used to be two copy-pasted jobs that had to be edited in
    # lockstep.
    name: Publish ${{ matrix.name }} (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: labkiosk
            image: ghcr.io/${{ github.repository }}
            context: .
            file: Dockerfile
          - name: labkiosk-iso-builder
            image: ghcr.io/${{ github.repository }}-iso-builder
            context: distro-builder
            file: distro-builder/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache keyed per image. The apt layer in each of these is
          # hundreds of megabytes and changes rarely; without a cache every run
          # re-downloaded and re-installed all of it.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
