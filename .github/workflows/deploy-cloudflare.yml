name: Deploy Cloudflare Control Plane

# Called by ci.yml on main once its worker job has typechecked and tested this
# commit (both Workers): a push that touches either Worker, or a manual run of
# ci.yml. Never on its own, so nothing untested reaches production.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never let two deploys (or a deploy and its migrations) interleave.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js v24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            cloudflare-control/pnpm-lock.yaml
            cloudflare-email-routing/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm --prefix cloudflare-control install --frozen-lockfile

      - name: Apply Remote D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --prefix cloudflare-control exec wrangler d1 migrations apply labkiosk-db --remote

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --prefix cloudflare-control exec wrangler deploy

      # After the controller: the email Worker's Service Binding names the
      # controller's MailIntake entrypoint, which must already be deployed.
      - name: Install Email Worker Dependencies
        run: pnpm --prefix cloudflare-email-routing install --frozen-lockfile

      - name: Deploy Email Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --prefix cloudflare-email-routing exec wrangler deploy
