name: Deploy Cloudflare Control Plane

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-control/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys (or a deploy and its migrations) interleave.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Test & Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js v22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloudflare-control/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm --prefix cloudflare-control install --frozen-lockfile

      - name: TypeScript Strict Typecheck
        run: pnpm --prefix cloudflare-control run typecheck

      - name: Run Multi-Tenant Test Suite
        run: pnpm --prefix cloudflare-control test

      - name: Apply Remote D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --prefix cloudflare-control exec wrangler d1 migrations apply labkiosk-db --remote

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --prefix cloudflare-control exec wrangler deploy
