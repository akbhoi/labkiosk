name: Bug Report
description: Report an issue with the Kiosk OS, Extension, or Cloudflare Worker
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you have tested against the latest version.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Client OS (Debian Live ISO / Openbox / Kernel)"
        - "Kiosk UI & Extension (Nav bar, Lock curtain, Policies)"
        - "Cloudflare Worker Controller (API, D1, Auth, Super Console)"
        - "Local Agent (agent.py, Setup Wizard, Telemetry)"
        - "Docker Simulation Environment"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Boot thin client with subdomain 'greenwood'
        2. Teacher clicks 'Lock All'
        3. Workstation fails to display curtain...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Copy logs from `/tmp/lab-agent.log`, browser console, or `wrangler dev`.
      render: shell
