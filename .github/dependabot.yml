version: 2
updates:
  - package-ecosystem: npm
    directory: /cloudflare-control
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      dev-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # These move together and are always reviewed together.
      docker-actions:
        patterns:
          - "docker/*"

  # The two Dockerfiles that are actually built and published. The root one was
  # previously unwatched -- the only Docker entry pointed at /docker-test, whose
  # Dockerfile was an unused duplicate and has been removed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /distro-builder
    schedule:
      interval: monthly
