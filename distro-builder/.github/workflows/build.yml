name: Build Lab Kiosk ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install live-build and Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Build Debian 12 Kiosk Hybrid ISO
        working-directory: distro-builder
        run: |
          sudo chmod +x build-iso.sh auto/* config/hooks/live/*
          sudo ./build-iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: labkiosk-debian12-amd64.iso
          path: distro-builder/labkiosk-debian12-amd64.iso
          retention-days: 14
