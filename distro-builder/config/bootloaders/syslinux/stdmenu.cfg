# Boot-chain lockdown. Every protection in this image -- masked TTYs, the
# Chromium policy, the RAM overlay, the locked window manager -- is started by
# the kernel this menu launches, so a student who can append `init=/bin/sh`
# here defeats all of it before any of it runs.
#
# ALLOWOPTIONS 0 makes syslinux ignore any kernel argument typed by the user;
# the `append` lines in live.cfg still apply in full. NOESCAPE 1 removes the
# Shift/Esc escape to the bare `boot:` prompt. Neither adds a prompt: pressing
# ENTER on any entry boots exactly as before, unattended.
ALLOWOPTIONS 0
NOESCAPE 1

menu background splash.png
menu color title	* #FFFFFFFF #00000000 none
menu color border	* #00000000 #00000000 none
menu color sel		* #FFFFFFFF #2563ebff bold
menu color hotsel	* #FFFFFFFF #3b82f6ff bold
menu color tabmsg	* #94a3b8ff #00000000 none
menu color help		* #60a5faff #00000000 none
menu color unsel	* #cbd5e1ff #00000000 none

menu vshift 16
menu hshift 10
menu rows 6
menu width 62
menu helpmsgrow 22
menu cmdlinerow 23
menu timeoutrow 23
menu tabmsgrow 24
menu tabmsg Press ENTER to boot
