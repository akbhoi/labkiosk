source /boot/grub/config.cfg

# Every entry is --unrestricted so that booting never prompts, even when
# config.cfg has loaded a superuser password. The password then guards only the
# edit (`e`) and command-line (`c`) keys, which is the whole point: a student
# must not be able to append init=/bin/sh, but a classroom machine must still
# power on into the kiosk with nobody at the keyboard.

menuentry "Start Lab Kiosk OS (Live Session)" --unrestricted --class debian --class gnu-linux --class os {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Install Lab Kiosk to Hard Disk / SSD" --unrestricted --class installer --class os {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ labkiosk.mode=install
	initrd	@INITRD_LIVE@
}

menuentry "Lab Kiosk OS (Safe Graphics Fallback)" --unrestricted --class recovery --class os {
	linux	@KERNEL_LIVE@ boot=live components nomodeset xforcevesa vga=791 overlayroot=tmpfs username=kiosk
	initrd	@INITRD_LIVE@
}

menuentry "Lab Kiosk OS (Load into RAM - toram)" --unrestricted --class ram --class os {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI Firmware Settings" --unrestricted {
		fwsetup
	}
fi

menuentry "Reboot System" --unrestricted {
	reboot
}
