source /boot/grub/config.cfg

menuentry "Start Lab Kiosk OS (Live Session)" --class debian --class gnu-linux --class os {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Install Lab Kiosk to Hard Disk / SSD" --class installer --class os {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ labkiosk.mode=install
	initrd	@INITRD_LIVE@
}

menuentry "Lab Kiosk OS (Safe Graphics Fallback)" --class recovery --class os {
	linux	@KERNEL_LIVE@ boot=live components nomodeset xforcevesa vga=791 overlayroot=tmpfs username=kiosk
	initrd	@INITRD_LIVE@
}

menuentry "Lab Kiosk OS (Load into RAM - toram)" --class ram --class os {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI Firmware Settings" {
		fwsetup
	}
fi

menuentry "Reboot System" {
	reboot
}
