set default=0
set timeout=5

# Boot-menu lockdown. Generated by auto/config from the PASSWORD_PBKDF2 value in
# config/includes.chroot/usr/share/labkiosk/grub.pin; absent when nothing is
# pinned, in which case the menu stays editable and the build prints a warning.
#
# The file only sets `superusers` and `password_pbkdf2`. Because every entry in
# grub.cfg is marked --unrestricted, the default entry still boots with no
# prompt; the password is asked for only when someone presses `e` or `c`.
if [ -e /boot/grub/labkiosk-password.cfg ]; then
    source /boot/grub/labkiosk-password.cfg
fi

# Video drivers for UEFI GOP, UGA, and hypervisors
insmod efi_gop
insmod efi_uga
insmod video_bochs
insmod video_cirrus
insmod all_video

# Font and graphics terminal
insmod font
if loadfont /boot/grub/unicode.pf2 ; then
    set gfxmode=1024x768,800x600,auto
    set gfxpayload=keep
    insmod gfxterm
    insmod gfxmenu
    insmod png
fi

terminal_output gfxterm

# Source theme
source /boot/grub/theme.cfg
