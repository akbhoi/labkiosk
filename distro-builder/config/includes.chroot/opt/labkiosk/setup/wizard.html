<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Kiosk - First Boot Setup Wizard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #374151;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .wizard-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      position: relative;
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
    }
    .wizard-title { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    .wizard-desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .input-field {
      width: 100%; background: #1f2937; border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; color: #fff; font-size: 14px; outline: none; transition: border 0.15s ease;
    }
    .input-field:focus { border-color: var(--accent); }
    .subdomain-wrap { display: flex; align-items: center; gap: 8px; }
    .subdomain-suffix { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); white-space: nowrap; }
    .hint-text { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .status-box {
      border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 20px; display: none; line-height: 1.5;
    }
    .status-success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
    .status-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
    .btn-submit {
      width: 100%; background: var(--accent); border: none; color: #fff; padding: 14px; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; display: flex;
      align-items: center; justify-content: center; gap: 10px;
    }
    .btn-submit:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <div class="wizard-card">
    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </div>
    <h1 class="wizard-title">Workstation Setup Wizard</h1>
    <p class="wizard-desc">
      Connect this computer to your school lab account. Once configured, this workstation will permanently link to your dashboard and lock down.
    </p>

    <div class="status-box" id="status-box"></div>

    <form id="setup-form">
      <div class="form-group">
        <label class="form-label">School Subdomain or Code</label>
        <div class="subdomain-wrap">
          <input type="text" id="school-subdomain" class="input-field" required placeholder="e.g. greenwood" style="font-family: monospace;">
          <span class="subdomain-suffix">.labkiosk.io</span>
        </div>
        <div class="hint-text">The subdomain you chosen when registering your school.</div>
      </div>

      <div class="form-group">
        <label class="form-label">Computer Identifier (PC Name)</label>
        <input type="text" id="client-id" class="input-field" required placeholder="e.g. PC-01" style="font-family: monospace;">
        <div class="hint-text">A unique identifier in your lab (e.g. PC-01, PC-02, DESK-14).</div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <span>Verify & Connect Workstation</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('setup-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const subdomain = document.getElementById('school-subdomain').value.trim().toLowerCase();
      const clientId = document.getElementById('client-id').value.trim().toUpperCase();

      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Connecting & Verifying...';
      statusBox.style.display = 'none';

      try {
        // Send configuration to local agent daemon
        const res = await fetch('http://127.0.0.1:8888/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subdomain, clientId })
        });
        const data = await res.json();

        if (data.status === 'ok') {
          statusBox.className = 'status-box status-success';
          statusBox.innerHTML = '<strong>Successfully Connected!</strong><br>Linked to ' + (data.schoolName || subdomain) + '. Entering locked student kiosk mode...';
          statusBox.style.display = 'block';

          setTimeout(() => {
            window.location.href = data.targetUrl || 'http://127.0.0.1:8888/api/status';
          }, 1500);
        } else {
          statusBox.className = 'status-box status-error';
          statusBox.innerHTML = '<strong>Verification Error:</strong> ' + (data.error || 'Could not connect to school subdomain.');
          statusBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.querySelector('span').textContent = 'Verify & Connect Workstation';
        }
      } catch (err) {
        statusBox.className = 'status-box status-error';
        statusBox.innerHTML = '<strong>Connection Failed:</strong> Could not communicate with local agent service.';
        statusBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = 'Verify & Connect Workstation';
      }
    });
  </script>
</body>
</html>
