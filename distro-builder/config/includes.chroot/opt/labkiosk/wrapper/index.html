<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lab Kiosk Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="kiosk-sensor" style="position: fixed; top: 0; left: 0; width: 100vw; height: 10px; z-index: 99; background: transparent;"></div>
  <!-- Top Navigation Header (Floating Auto-Hide) -->
  <header id="kiosk-header">
    <div class="nav-controls">
      <button id="btn-home" class="nav-btn" title="Return to Lesson Home">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </button>

      <button id="btn-back" class="nav-btn" title="Go Back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Back</span>
      </button>

      <button id="btn-forward" class="nav-btn" title="Go Forward">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <span>Forward</span>
      </button>

      <button id="btn-reload" class="nav-btn" title="Reload Page">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Reload</span>
      </button>
    </div>

    <!-- Active Lesson Title / Domain Status -->
    <div class="active-status">
      <span class="status-shield" title="Verified Secure Educational Environment">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#22c55e" stroke-width="2.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </span>
      <span id="active-url-display">Connecting to Lab Control...</span>
    </div>

    <!-- Client Identification & Sync Indicator -->
    <div class="client-meta">
      <div class="status-dot" id="sync-dot" title="Connected to Cloud Controller"></div>
      <span id="client-id-badge">PC--</span>
    </div>
  </header>

  <!-- Main Viewport (Sandboxed Educational Content) -->
  <main id="viewport-container">
    <iframe 
      id="content-frame" 
      src="about:blank"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    ></iframe>
  </main>

  <!-- Fullscreen Teacher Lock Curtain ("Eyes to the Front") -->
  <div id="lock-curtain" class="hidden">
    <div class="curtain-content">
      <div class="lock-icon-wrapper">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 id="lock-heading">Attention Please</h1>
      <p id="lock-message">Screens have been locked by the teacher. Please direct your attention to the front of the lab.</p>
      <div class="lock-pulse"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
