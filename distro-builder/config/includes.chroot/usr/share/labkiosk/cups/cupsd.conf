# Lab Kiosk: the print scheduler's configuration, installed into
# /etc/cups/cupsd.conf by labkiosk-printing when an administrator turns
# printing on (Settings -> Printing). With printing off, CUPS is masked and
# this file is never read.
#
# Chromium on this workstation is the only client. So: the local socket only,
# no TCP port (the browser's allowlist lets any page reach 127.0.0.1 on any
# port, so a web interface on :631 would be a page to change printers from),
# no sharing, no printer discovery, no job history and no document kept once
# printed. Printers are added by labkiosk-printing alone, as root.

LogLevel warn
MaxLogSize 1m
PageLogFormat

Listen /run/cups/cups.sock
WebInterface No
Browsing No
BrowseLocalProtocols none
DefaultShared No
PreserveJobHistory No
PreserveJobFiles No
MaxJobs 100
MaxJobsPerUser 20
ErrorPolicy abort-job
JobRetryLimit 2
Timeout 120
DefaultAuthType Basic
DefaultEncryption IfRequested

<Location />
  Order allow,deny
</Location>
<Location /admin>
  Order allow,deny
</Location>
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
</Location>
<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
