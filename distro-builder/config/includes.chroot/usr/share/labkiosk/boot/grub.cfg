# Lab Kiosk OS -- boot menu of an installed workstation.
#
# labkiosk-install copies this file to LABKIOSK_ROOT/boot/grub/grub.cfg. It
# holds nothing specific to one machine or one release, so every system image
# boots through the same menu (docs/OTA_UPDATES.md section 5.1):
#
#   images/<version>/      vmlinuz, initrd.img, filesystem.squashfs
#   boot/grub/grubenv      current, previous, next, next_tries
#   boot/grub/labkiosk-data.cfg   this disk's data partition UUID (installer)
#
# `current` boots. A new image gets exactly one try: with next set and
# next_tries=1, the try is spent *before* `next` boots, so the boot after
# that is `current` again unless labkiosk-boot-ok.service confirmed the new
# image healthy and made it current. A panic reboots (panic=10) straight back
# into the old image.
#
# Every entry is --unrestricted: the machine powers on into the kiosk with
# nobody at the keyboard. The per-installation password in
# labkiosk-password.cfg guards only the edit (`e`) and command-line (`c`) keys.

if [ -f "$prefix/labkiosk-password.cfg" ]; then
    source "$prefix/labkiosk-password.cfg"
fi

insmod part_gpt
insmod ext2
insmod loadenv
insmod regexp
insmod probe

set timeout=3
set default=0

set current=""
set previous=""
set next=""
set next_tries=""
if [ -f "$prefix/grubenv" ]; then
    load_env --file "$prefix/grubenv" current previous next next_tries
fi

function labkiosk_has_image {
    if [ -z "$1" ]; then
        return 1
    fi
    if [ -f "/images/$1/vmlinuz" -a -f "/images/$1/initrd.img" -a -f "/images/$1/filesystem.squashfs" ]; then
        return 0
    fi
    return 1
}

set slot=""

# The one try. Spend it first, and boot `next` only if spending it worked:
# a try that could not be recorded would be retried at every boot, forever.
if [ -n "$next" -a "$next_tries" = "1" ]; then
    set next_tries=0
    if save_env --file "$prefix/grubenv" next_tries; then
        if labkiosk_has_image "$next"; then
            set slot="$next"
        fi
    fi
fi

if [ -z "$slot" ]; then
    if labkiosk_has_image "$current"; then
        set slot="$current"
    fi
fi
if [ -z "$slot" ]; then
    if labkiosk_has_image "$previous"; then
        set slot="$previous"
    fi
fi

# Last resort: grubenv is missing or damaged. Boot any complete image rather
# than leave the workstation at a menu nobody is there to answer.
if [ -z "$slot" ]; then
    for candidate in /images/*; do
        if [ -z "$slot" ]; then
            if regexp --set=1:name "^/images/([^/]+)\$" "$candidate"; then
                if labkiosk_has_image "$name"; then
                    set slot="$name"
                fi
            fi
        fi
    done
fi

# /etc/labkiosk is mounted from the data partition with exactly this UUID
# (labkiosk-data-generator), never by label: a USB stick can carry the label.
# Anything that is not a UUID is dropped, and the partition stays unmounted.
set data_uuid=""
if [ -f "$prefix/labkiosk-data.cfg" ]; then
    source "$prefix/labkiosk-data.cfg"
fi
if ! regexp "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\$" "$data_uuid"; then
    set data_uuid=""
fi

# live-boot finds this partition by its own UUID rather than by label: a second
# disk that was once a Lab Kiosk installation carries the same label. The label
# is only the fallback for a GRUB build without `probe`.
set media="/dev/disk/by-label/LABKIOSK_ROOT"
if probe --set=root_uuid --fs-uuid "$root"; then
    if [ -n "$root_uuid" ]; then
        set media="/dev/disk/by-uuid/$root_uuid"
    fi
fi

export slot
export previous
export media
export data_uuid

menuentry "Lab Kiosk OS" --unrestricted --id labkiosk {
    if [ -z "$slot" ]; then
        echo "Lab Kiosk: no complete system image on this disk. Reinstall from the Lab Kiosk ISO."
        sleep 30
        reboot
    fi
    linux /images/$slot/vmlinuz boot=live components consoleblank=0 overlayroot=tmpfs:recurse=0 username=kiosk live-media=$media live-media-path=/images/$slot labkiosk.installed=1 labkiosk.data=$data_uuid noeject panic=10
    initrd /images/$slot/initrd.img
}

if [ -n "$previous" -a "$previous" != "$slot" ]; then
    if labkiosk_has_image "$previous"; then
        menuentry "Lab Kiosk OS $previous (previous version)" --unrestricted --id labkiosk-previous {
            linux /images/$previous/vmlinuz boot=live components consoleblank=0 overlayroot=tmpfs:recurse=0 username=kiosk live-media=$media live-media-path=/images/$previous labkiosk.installed=1 labkiosk.data=$data_uuid noeject panic=10
            initrd /images/$previous/initrd.img
        }
    fi
fi

if [ "${grub_platform}" = "efi" ]; then
    menuentry "UEFI Firmware Settings" --unrestricted {
        fwsetup
    }
fi
