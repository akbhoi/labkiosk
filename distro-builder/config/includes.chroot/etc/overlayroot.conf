# overlayroot configuration for Lab Kiosk
# Enforces read-only rootfs with RAM tmpfs overlay (zero SSD wear, resets on reboot)
#
# The options belong INSIDE this value, after a colon. overlayroot's initramfs
# script reads exactly two variables from this file -- overlayroot and
# overlayroot_cfgdisk -- so an "overlayroot_options=" line is read by nothing and
# leaves recurse at its default of 1. That default rewrites every /etc/fstab
# entry into an overlay with a tmpfs upper layer, LABKIOSK_DATA included: the
# workstation enrols happily into RAM and forgets it at the next power-off, with
# /etc/labkiosk still looking like a perfectly good mount point. recurse=0 keeps
# the overlay on / alone and lets the data partition mount as itself.
overlayroot="tmpfs:recurse=0"
