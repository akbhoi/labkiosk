# Lab Kiosk: compressed RAM as the first swap, on every boot (systemd-zram-generator).
#
# The root filesystem is a RAM overlay, so everything a workstation writes
# competes with the browser for memory. Compressing pages the browser has not
# touched lately buys room without writing anything to disk. Half the RAM at
# most, never more than 4 GiB; zstd, which compresses web pages about 3:1.
# An installed disk also has an encrypted swap partition behind this one
# (labkiosk-swap.service), used only when this is full.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
