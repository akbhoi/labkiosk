# Lab Kiosk: arm Wake-on-LAN on the network adapters, so a workstation that is
# off can be switched on from the console (Workstations -> Wake): a workstation
# that is on at the same site sends it a magic packet.
#
# A drop-in for systemd's own 99-default.link, so the adapters keep their usual
# names; udev applies it as each adapter appears. An adapter that cannot wake
# the machine (Wi-Fi, most virtual ones) logs that and is otherwise unchanged.
# The firmware must allow it too: "Wake on LAN" or "Power on by PCI-E" in the
# machine's setup screen.
[Link]
WakeOnLan=magic
