# Lab Kiosk: no suspend or hibernation of any kind (logind.conf.d/labkiosk.conf
# says why). The sleep targets are masked as well (01-lockdown.hook.chroot);
# this also refuses a request that reaches systemd-sleep by another route.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
