# Lab Kiosk: a workstation is on, or it powers off or restarts; it never sleeps.
# It boots in well under a minute, and a sleeping kiosk is one nobody can reach
# from the console. The power button powers off cleanly (labkiosk-logs records
# the shutdown); the sleep keys and the lid do nothing, so a laptop used as a
# kiosk keeps running with its lid shut.
[Login]
HandlePowerKey=poweroff
HandleRebootKey=reboot
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
