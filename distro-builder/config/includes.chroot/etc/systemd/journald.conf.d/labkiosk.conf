# Lab Kiosk: the journal on an installed disk lives on LABKIOSK_DATA
# (labkiosk-logs.service), a 512 MiB partition it shares with the enrolment.
# Seven days, and never more than 128 MiB of it; labkiosk-logs deletes earlier
# boots' journals by the same rules. One file a day, so a day can be deleted
# on its own. A live session keeps its journal in /run, in RAM.
[Journal]
SystemMaxUse=128M
SystemKeepFree=64M
MaxRetentionSec=7day
MaxFileSec=1day
