# Lab Kiosk: restart a workstation that stops responding.
#
# systemd pets the hardware watchdog (iTCO on Intel, sp5100_tco on AMD, the
# ones most boards have) every 15 seconds; a kernel that hangs stops petting
# it, and the board resets itself 30 seconds later. RebootWatchdogSec does the
# same for a reboot that hangs on the way down. A machine without a hardware
# watchdog ignores both. The boot after a reset is reported with its log
# (labkiosk-logs.service).
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
