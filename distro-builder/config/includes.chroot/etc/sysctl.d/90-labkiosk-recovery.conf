# Lab Kiosk: come back on its own from a crash, and prefer compressed RAM.
#
# An installed disk's kernel command line already says panic=10; this covers
# the live session too. A soft lockup (a CPU stuck in the kernel) panics, and
# so restarts, instead of leaving a frozen screen nobody is there to reset.
# Oopses deliberately do not: an oops in a driver at every boot would turn into
# an endless restart loop the workstation could never report.
kernel.panic = 10
kernel.softlockup_panic = 1

# zram is RAM: swapping to it early is cheap, and reading back one page at a
# time is right for it (page-cluster 0).
vm.swappiness = 100
vm.page-cluster = 0
